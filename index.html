<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
</head>
<body>
    <header>
        <h1>
            Formulário de Cadastro<br/>
        </h1>
    </header>
    <form>
        <label for="seu-nome">Nome</label>
        <input id="seu-nome" type="text"/><br /><br />
        <label for="seu-email">Email</label>
        <input id="seu-email" type="email"/><br /><br />
        <label for="senha">Senha</label>
        <input id="senha" type="password"/><br /><br />
        <button type="submit">
            Cadastrar
        </button>
    </form>
</body>
</html>
